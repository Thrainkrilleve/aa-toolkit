{% load i18n %}
{% if status == "SUCCESS" %}
    <span class="badge rounded-pill text-bg-success"><i class="fa-solid fa-check me-1" aria-hidden="true"></i>{% translate "Success" %}</span>
{% elif status == "FAILED" %}
    <span class="badge rounded-pill text-bg-danger"><i class="fa-solid fa-xmark me-1" aria-hidden="true"></i>{% translate "Failed" %}</span>
{% elif status == "RUNNING" %}
    <span class="badge rounded-pill text-bg-info"><span class="spinner-border spinner-border-sm me-1 aat-badge-spinner" aria-hidden="true"></span>{% translate "Running" %}</span>
{% elif status == "PENDING" %}
    <span class="badge rounded-pill text-bg-secondary"><i class="fa-regular fa-clock me-1" aria-hidden="true"></i>{% translate "Queued" %}</span>
{% else %}
    <span class="badge rounded-pill text-bg-secondary">{{ status }}</span>
{% endif %}
